distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
# The Actions cache is unreliable right now, so the runner often has to fetch
# the distribution fresh. It downloads from services.gradle.org, which
# redirects to github.com/gradle/gradle-distributions — that endpoint
# returned HTTP 504 on 2026-11-08 while GitHub was degraded, killing the
# build before any code ran. 5 minutes gives a slow CDN room.
networkTimeout=300000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
