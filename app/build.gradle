plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing. CI passes the keystore through environment variables;
// local builds can use keystore.properties in the project root (never committed).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def envKeystore = System.getenv('OYEAI_KEYSTORE_FILE')
def useEnvSigning = envKeystore != null && envKeystore != ''
def hasSigning = useEnvSigning || keystorePropsFile.exists()

android {
    namespace 'com.oyeai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.oyeai'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        if (hasSigning) {
            release {
                if (useEnvSigning) {
                    storeFile new File(envKeystore)
                    storePassword System.getenv('OYEAI_KEYSTORE_PASSWORD')
                    keyAlias System.getenv('OYEAI_KEY_ALIAS')
                    keyPassword System.getenv('OYEAI_KEY_PASSWORD')
                } else {
                    storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                    storePassword keystoreProps.getProperty('storePassword')
                    keyAlias keystoreProps.getProperty('keyAlias')
                    keyPassword keystoreProps.getProperty('keyPassword')
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.5'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is a stub on the JVM, so unit tests need the real one.
    testImplementation 'org.json:json:20231013'
}
