name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (only if the secret is set)
        env:
          KEYSTORE_B64: ${{ secrets.OYEAI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OYEAI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Require signing secrets for a release tag
        if: startsWith(github.ref, 'refs/tags/v') && env.OYEAI_KEYSTORE_FILE == ''
        run: |
          echo "::error::Release tags need the OYEAI_KEYSTORE_* secrets. An unsigned APK cannot be installed."
          exit 1

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        env:
          OYEAI_KEYSTORE_PASSWORD: ${{ secrets.OYEAI_KEYSTORE_PASSWORD }}
          OYEAI_KEY_ALIAS: ${{ secrets.OYEAI_KEY_ALIAS }}
          OYEAI_KEY_PASSWORD: ${{ secrets.OYEAI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oye-ai-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk

      # Every push to main gets its own release with a signed APK, so the newest build is always
      # at the top of the Releases page. Skipped when the signing secrets are not set.
      - name: Publish build for every push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.OYEAI_KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: OYE build ${{ github.run_number }}
          body: Automatic build of ${{ github.sha }}.
          make_latest: true
          files: app/build/outputs/apk/release/*.apk
